services:
  - type: web
    name: gwiga-on
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COMEBACK_SECRET_KEY
        generateValue: true
      - key: COMEBACK_COOKIE_SECURE
        value: "1"
      # TMAP_APP_KEY는 Render Environment에서 직접 등록합니다.
      # 현재 free 플랜의 로컬 데이터는 재배포 시 초기화될 수 있습니다.
      # 계정/제보를 지속 운영하려면 영구 저장소를 연결해야 합니다.
