services:
  - type: web
    name: gwiga-on
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COMEBACK_SECRET_KEY
        generateValue: true
      - key: COMEBACK_COOKIE_SECURE
        value: "1"
      # TMAP_APP_KEY는 Render Environment에서 직접 등록합니다.
      # free는 지도/검색 확인용입니다. 영구 디스크가 없으면 이메일 가입/로그인을 열지 않습니다.
      # 기존 유료 서비스에 계정을 유지하려면 Disk를 /var/data에 실제로 연결하고
      # COMEBACK_DATA_DIR=/var/data/comeback-on을 Environment에 추가하세요.
      # 이 파일은 유료 플랜이나 디스크를 자동 신청하지 않습니다.
